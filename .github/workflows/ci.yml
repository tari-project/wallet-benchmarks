name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake jq lsof protobuf-compiler sqlite3
      - name: Install ast-grep
        run: npm install --global @ast-grep/cli
      - name: Verify pinned source provenance
        run: |
          scripts/fetch-minotari-cli.sh --verify-only .bench-cache tools
          scripts/fetch-payment-processor.sh --verify-only .bench-cache tools
      - name: Verify emitted build-manifest claims
        run: cargo test --locked build_manifest::tests::emitted_manifest_claims_match_embedded_provenance -- --exact
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --locked --all-features
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test default features
        run: cargo test --locked
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Test correction policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: ast-grep
        run: ast-grep scan
      - name: Generated schema is current
        run: cargo run --locked -- schema --out RESULT_PROFILE_SCHEMA.json && git diff --exit-code -- RESULT_PROFILE_SCHEMA.json
      - name: Verify committed historical baseline integrity
        run: |
          python3 scripts/correct-profile.py \
            --raw analysis/reconciliation/esmeralda_baseline.raw.json \
            --manifest analysis/reconciliation/esmeralda_baseline.correction.json \
            --out /tmp/esmeralda_baseline.schema-v6.verified.json
          cmp baselines/esmeralda_baseline.schema-v6.json /tmp/esmeralda_baseline.schema-v6.verified.json
      - name: Validate committed historical baseline
        run: cargo run --locked -- validate-profile --profile baselines/esmeralda_baseline.schema-v6.json --legacy-v6
      - name: Verify committed historical summary
        run: |
          cargo run --locked -- summarize-profile --profile baselines/esmeralda_baseline.schema-v6.json --out /tmp/esmeralda_baseline.schema-v6.summary.md --legacy-v6
          cmp baselines/esmeralda_baseline.schema-v6.summary.md /tmp/esmeralda_baseline.schema-v6.summary.md
      - name: Verify schema-v7 finalization evidence
        run: |
          evidence_path=$(jq -r '.evidence.path' analysis/reconciliation/esmeralda_baseline.schema-v7.correction.json)
          evidence_sha=$(jq -r '.evidence.sha256' analysis/reconciliation/esmeralda_baseline.schema-v7.correction.json)
          printf '%s  %s\n' "$evidence_sha" "$evidence_path" | sha256sum --check --strict
          failure_path=$(jq -r '.failure_log_path' analysis/reconciliation/esmeralda_baseline.schema-v7.correction.json)
          failure_sha=$(jq -r '.failure_log_sha256' "$evidence_path")
          printf '%s  %s\n' "$failure_sha" "$failure_path" | sha256sum --check --strict
      - name: Verify committed schema-v7 baseline integrity
        run: |
          python3 scripts/correct-profile.py \
            --raw analysis/reconciliation/esmeralda_baseline.schema-v7.raw.json \
            --manifest analysis/reconciliation/esmeralda_baseline.schema-v7.correction.json \
            --out /tmp/esmeralda_baseline.schema-v7.verified.json
          cmp baselines/esmeralda_baseline.json /tmp/esmeralda_baseline.schema-v7.verified.json
      - name: Validate committed schema-v7 baseline
        run: cargo run --locked -- validate-profile --profile baselines/esmeralda_baseline.json --submission
      - name: Verify committed schema-v7 summary
        run: |
          cargo run --locked -- summarize-profile --profile baselines/esmeralda_baseline.json --out /tmp/esmeralda_baseline.summary.md
          cmp baselines/esmeralda_baseline.summary.md /tmp/esmeralda_baseline.summary.md
      - name: Reject tracked secret artifacts
        run: |
          test -z "$(git ls-files \
            '*.env' '*.db' '*.sqlite' '*.sqlite3' '*.pem' '*.key' \
            '*.prepared-transaction.json' '.secrets/**' 'harness.toml')"
      - name: Diff hygiene
        run: git diff --check
