# Wallet benchmark harness configuration.
#
# Copy to `benchmark.toml` and adjust. Every key is optional: anything left out falls back to
# the reference default shown here (see `src/config.rs`). Unknown keys are rejected at start-up
# so a typo never silently changes what was measured.
#
# No secrets live in this file. The wallet password comes from the environment variable named
# in `password_env`, and the seed words live in `seed_file`, which must stay out of git.

network = "esmeralda"
base_node_url = "https://rpc.esmeralda.tari.com"

data_dir = "data"
results_dir = "results"
seed_file = "data/seeds.json"
password_env = "HARNESS_WALLET_PW"

[old_wallet]
# Path to the minotari_console_wallet binary the harness spawns.
binary = "minotari_console_wallet"
grpc_port = 18143
# A fresh data directory means a full recovery scan before gRPC comes up, so this is generous.
startup_timeout_secs = 7200
# Retries the wallet gives its own recovery before exiting (tari's default is 3). A public
# base node gateway returning a single 503 mid-scan otherwise ends the run; a retry resumes
# where it left off and is included in the reported T_scan.
recovery_retry_limit = 10
# Bound on the post-recovery validation wait, kept separate from the scan budget. A wallet
# with nothing to validate never reports validation complete, so this is never waited out on
# an empty wallet; see modes/old_wallet.rs.
validation_timeout_secs = 1800
# How long the recovered UTXO set must hold still before revalidation counts as finished.
validation_stable_secs = 60

[new_wallet]
scan_batch_size = 100
scan_threads = 8
lock_seconds = 300
# The library sizes its own pool at 5 connections with a 30s checkout timeout, so past a
# handful of concurrent sends S4 would measure the pool. 0 = size it to the peak of
# concurrent_batches (the value used is recorded in the profile).
db_pool_size = 0
# Must stay above params.s4_budget_secs, or a queued send fails on the pool before S4 stops
# waiting for it (start-up refuses the combination).
db_checkout_timeout_secs = 1200

[params]
# Funding UTXO per mode, in µT. 10,000 tXTM.
a_fund = 10000000000
# Confirmation depth before a UTXO counts as spendable.
c_min = 3
# UTXO count after S1: must equal 2^doubling_rounds * fanout_outputs_per_tx.
volume_target = 512
doubling_rounds = 6
fanout_outputs_per_tx = 8
# S4 concurrency ramp and the stop condition per level.
concurrent_batches = [8, 16, 32, 64, 128]
s4_budget_secs = 900
# S5 recipient set and batch width.
s5_m = 100
s5_k = 10
# Fee rate handed to both wallet modes, in µT per gram.
fee_rate = 5
# Amount per output, in µT.
s4_amount = 100000
s5_amount = 100000
# Waits. Generous on purpose: a stalled-but-progressing wallet should get credit for
# finishing, and the stall still shows up in the timings.
confirm_timeout_secs = 1800
scan_timeout_secs = 7200
fund_timeout_secs = 3600
poll_interval_secs = 10
