# The tari project's house rustfmt profile, with `edition` and the width budget adjusted to
# this crate. Committed so `cargo +nightly fmt --all` is a no-op on a clean tree rather than
# reformatting the repository differently on every machine. Several of these options are
# nightly only, hence `unstable_features` and `cargo +nightly fmt`.
binop_separator = "Back"
use_small_heuristics = "Default"
comment_width = 100
edition = "2021"
format_code_in_doc_comments = true
format_strings = true
group_imports = "StdExternalCrate"
hard_tabs = false
imports_layout = "HorizontalVertical"
imports_granularity = "Crate"
match_block_trailing_comma = true
max_width = 100
newline_style = "Auto"
normalize_comments = true
overflow_delimited_expr = true
reorder_imports = true
reorder_modules = true
reorder_impl_items = true
space_after_colon = true
space_before_colon = false
struct_lit_single_line = true
use_field_init_shorthand = true
use_try_shorthand = true
unstable_features = true
where_single_line = true
wrap_comments = true
ignore = []
