# Default configuration for Tari Wallet Benchmarks
# Copy this to config.local.yaml and edit for your setup

# --- Funding & network ---
A_fund: 10000                          # tXTM — single funding UTXO
C_min: 3                               # confirmation depth
fee_rate: 1                            # pinned fee rate
base_node_url: "http://127.0.0.1:18142"
esmeralda_network: "esmeralda"
faucet_url: ""                         # optional funding faucet

# --- UTXO build-up (S1) ---
volume_target: 512
doubling_rounds: 6
fanout_outputs_per_tx: 8

# --- Concurrency (S4) ---
concurrent_batches: [8, 16, 32, 64, 128]
S4_T_budget_seconds: 900              # 15 min

# --- Payment processor (S5) ---
S5_M: 100                              # total recipients
S5_K: 10                               # outputs per batch tx

# --- Wallet binaries ---
console_wallet_bin: "minotari_console_wallet"
cli_bin: "minotari-cli"
base_node_bin: "minotari_base_node"
wallet_version_tag: "v0.59.0-pre.1"

# --- Paths ---
data_dir: "./.tari-bench-data"
log_dir: "./.tari-bench-logs"
result_file: "benchmark_result.json"
wallet_seed_words: ""

# --- Mode filters ---
wallet_modes:
  - old
  - new
  - payment

# --- Misc ---
debug: false
scenario_timeout_multiplier: 1.0
