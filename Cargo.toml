[package]
name = "wallet-benchmarks"
version = "0.1.0"
edition = "2021"
authors = ["The Tari Development Community"]
license = "BSD-3-Clause"
description = "Reproducible performance benchmark harness for the Tari wallets"
repository = "https://github.com/tari-project/wallet-benchmarks"

[[bin]]
name = "wallet-benchmarks"
path = "src/main.rs"

[dependencies]
# --- harness plumbing -------------------------------------------------------
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
hex = "0.4"
log = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
toml = "0.8"
url = "2.5"
zeroize = "1.8"

# --- old wallet (minotari_console_wallet) : gRPC ----------------------------
# `default-features = false` keeps `tari_core`/`tari_comms` out of the build;
# the generated `tari_rpc` client is not behind that feature.
minotari_app_grpc = { version = "6.2.0-pre.1", default-features = false }
tonic = { version = "0.13.1", features = ["tls-ring"] }

# --- new wallet (minotari-cli) : library ------------------------------------
minotari = { git = "https://github.com/tari-project/minotari-cli", rev = "1ab7c8c651b2937a8b05fba9d5a432cf633ae3f8" }
# Same version the wallet library uses, so the pooled connections are the same type. Needed
# for one narrow query the library cannot answer; see `modes::new_wallet::output_depth`.
rusqlite = { version = "0.39", features = ["bundled"] }
# Same versions the wallet library uses, so the pool it hands out and the one opened here are
# the same types. Needed to open the wallet database with more than `DB_POOL_SIZE = 5`
# connections; see `modes::new_wallet::open_pool`.
r2d2 = "0.8.10"
r2d2_sqlite = "0.34"

# --- payment processor mode : HTTP to the minotari daemon and the processor --------------
# `rustls-tls` rather than the platform TLS stack: both services are on loopback, so this only
# has to build everywhere, and linking OpenSSL for a localhost call is not worth it.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- shared tari primitives (seeds, addresses, offline signing) -------------
tari_common = "6.2.0-pre.1"
tari_common_types = "6.2.0-pre.1"
tari_crypto = { version = "0.24", features = ["borsh"] }
tari_transaction_components = "6.2.0-pre.1"
tari_utilities = { version = "0.10", features = ["std"] }

[dev-dependencies]
tempfile = "3"
